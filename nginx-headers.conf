# Cabeceras comunes. Se incluye en CADA location con add_header propio (add_header no se hereda).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
# CSP conservadora (nivel 1): no restringe orígenes de script/connect (GTM inyecta tags dinámicos
# y hay ~15 integraciones + scripts inline) para no romper nada; sí bloquea plugins, inyección de
# <base>, enmarcado externo y fuerza https en subrecursos. Endurecer a allowlist estricta requeriría
# nonces + inventariar todos los destinos de GTM.
add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;
# Vacío (producción) → nginx no la envía; beta.* → noindex (map en nginx.conf).
add_header X-Robots-Tag $robots_noindex always;
