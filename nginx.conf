# Elige el manifest PWA según la ruta para que cada portal se instale como su
# propia app (iOS lee el <link manifest> del HTML servido, no del JS). En http
# context porque este archivo se incluye dentro de http{} (conf.d/default.conf).
map $uri $portal_manifest {
  default      "/manifest.webmanifest";
  ~^/empleados "/manifest-empleados.webmanifest";
  ~^/cliente   "/manifest-cliente.webmanifest";
  ~^/agencias  "/manifest-agencias.webmanifest";
  ~^/admin     "/manifest-admin.webmanifest";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida sirve index.html (React Router). Además
  # reescribe el <link rel="manifest"> del HTML al manifest del portal según la
  # ruta (no-op en la web pública). Así cada portal es instalable como su app.
  location / {
    sendfile off;                 # sub_filter no actúa sobre respuestas servidas con sendfile
    sub_filter '/manifest.webmanifest' '$portal_manifest';
    sub_filter_once on;
    sub_filter_types text/html;
    add_header X-Portal-Manifest $portal_manifest always;
    try_files $uri $uri/ /index.html;
  }

  # Assets con hash en el nombre: cache larga e inmutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca cacheado → los deploys se ven al instante.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # gzip básico
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
