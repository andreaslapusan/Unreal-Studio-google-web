# Elige el manifest PWA según la ruta ORIGINAL pedida (no $uri, que cambia con el
# try_files interno a /index.html). Así cada portal se instala como su propia app
# (iOS lee el <link manifest> del HTML servido). http context (conf.d/default.conf).
map $request_uri $portal_manifest {
  default      "/manifest.webmanifest";
  ~^/empleados "/manifest-empleados.webmanifest";
  ~^/cliente   "/manifest-cliente.webmanifest";
  ~^/agencias  "/manifest-agencias.webmanifest";
  ~^/admin     "/manifest-admin.webmanifest";
}

# beta.* no se indexa (X-Robots-Tag + robots.txt). Producción: cadena vacía → sin cabecera.
map $host $robots_noindex {
  default    "";
  ~*^beta\.  "noindex, nofollow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  # Las rutas de idioma (/es, /en, /ro, /id) crean DIRECTORIOS en el pre-render OG
  # (dist/<locale>/proyecto/...) que NO tienen index.html. Si nginx intenta servir
  # ese directorio devuelve 403 Forbidden. Reconducimos cualquier 403 a la SPA.
  error_page 403 =200 /index.html;

  # Proyectos renombrados (28-oct-2026): los enlaces viejos (con o sin prefijo de
  # idioma, slug corto o SEO largo) hacen 301 al slug nuevo. Location relativo para
  # que el proxy de Coolify no reescriba a http://…:80. Destino = slug corto (su
  # pre-render existe y la SPA pasa a la URL SEO) → no depende de la location.
  absolute_redirect off;
  rewrite ^/((?:es|en|ro|id)/)?proyecto/melasti-reef-apartments-1bd(?:-[a-z0-9-]*)?/?$ /$1proyecto/marina-sand-apartments-1bd permanent;
  rewrite ^/((?:es|en|ro|id)/)?proyecto/karma-hills-2bd(?:-[a-z0-9-]*)?/?$ /$1proyecto/vista-mar-villas-2bd permanent;
  rewrite ^/((?:es|en|ro|id)/)?proyecto/monster-villa-4bd(?:-[a-z0-9-]*)?/?$ /$1proyecto/obsidian-villa-4bd permanent;
  rewrite ^/((?:es|en|ro|id)/)?proyecto/balangan-reef-apartments-1bd(?:-[a-z0-9-]*)?/?$ /$1proyecto/coral-bay-apartments-1bd permanent;

  # Posts sustituidos por landings (29-oct-2026). Mantener en sync con REDIRECTED_POSTS
  # de scripts/prerender-og.mjs y generate-sitemap.mjs.
  rewrite ^/(?:es/)?blog/financiar-una-propiedad-en-bali-opciones-para-inversores/?$ /es/comprar-sobre-plano-bali permanent;
  rewrite ^/(?:en|ro|id)/blog/financiar-una-propiedad-en-bali-opciones-para-inversores/?$ /en/buy-off-plan-bali permanent;
  # Activar el día que se publique /es/rentabilidad-inversion-bali (falta OK del escenario del 28 %):
  # rewrite ^/(?:es/)?blog/roi-en-bali-cifras-reales-de-nuestros-proyectos/?$ /es/rentabilidad-inversion-bali permanent;
  # rewrite ^/(?:en|ro|id)/blog/roi-en-bali-cifras-reales-de-nuestros-proyectos/?$ /en/bali-investment-returns permanent;

  # Barra final → sin barra (/es/ → /es, /es/proyectos/ → /es/proyectos). Relativo (absolute_redirect off).
  rewrite ^/(.+)/$ /$1 permanent;

  location = / { return 301 /es; }
  location = /service { return 301 /es; }
  # Rutas públicas sin idioma → /es/… (NO /agencias: start_url del PWA de agencias y prefijo de portales).
  location ~ ^/(proyectos|projects|proyecto|blog|faq|preguntas-frecuentes|agendar|booking|contacto|contact|privacidad|terminos|aviso-legal)(/.*)?$ {
    return 301 /es$request_uri;
  }

  location = /robots.txt {
    default_type text/plain;
    include /etc/nginx/snippets/headers.conf;
    if ($host ~* ^beta\.) { return 200 "User-agent: *\nDisallow: /\n"; }
    try_files $uri =404;
  }

  # Proxy de ficheros (reportes de obra, brochures) desde Supabase Storage para
  # que el cliente vea la URL en nuestro dominio (unrealstudiobali.com/r/…) y NO
  # se exponga el backend. Streaming directo (no descarga previa) → misma velocidad.
  location ^~ /r/ {
    proxy_pass https://rnielxgackkshnatvagj.supabase.co/storage/v1/object/public/images/;
    proxy_set_header Host rnielxgackkshnatvagj.supabase.co;
    proxy_ssl_server_name on;
    proxy_hide_header Content-Disposition;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/headers.conf;
  }

  # Assets con hash en el nombre: cache larga e inmutable.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/headers.conf;
  }

  # Enlaces PRIVADOS de auto-alta (/listing/:token): servir listing.html (OG neutro
  # + noindex) para que el preview al compartir NO muestre el marketing del site
  # (ROI/precios) ni se indexen. La SPA lee el token del path igual.
  location ^~ /listing/ {
    sendfile off;
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/snippets/headers.conf;
    try_files /listing.html =404;
  }

  # Antes que las regex de abajo (las regex se evalúan en orden).
  # Manifests PWA: iOS IGNORA el manifest si no llega con el content-type correcto
  # (por defecto nginx servía .webmanifest como application/octet-stream → iOS usaba
  # start_url "/" y no se podía instalar /empleados como su app). Forzar el tipo.
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/headers.conf;
  }

  # Fichas y posts: solo si existe su prerender (404 real; antes 200 soft-404).
  location ~ ^/(es|en|ro|id)/(proyecto|blog)/[^/]+$ {
    sendfile off;
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/snippets/headers.conf;
    try_files $uri.html =404;
  }

  # 404 REAL (antes soft-404 con 200): rutas /<idioma>/<segmento-desconocido>. Las
  # rutas públicas/portales conocidas siguen yendo a la SPA (también /proyecto/* y
  # /blog/* con slugs nuevos aún sin pre-render). 404.html = SPA + noindex.
  location ~ ^/(es|en|ro|id)/(?!(proyectos|projects|proyecto|blog|faq|preguntas-frecuentes|agendar|booking|contacto|contact|privacidad|terminos|aviso-legal|agencias|agencies|agentii|agensi|clientes|clients|clienti|klien|empleados|employees|angajati|karyawan|admin)(/|$)). {
    sendfile off;
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/snippets/headers.conf;
    # Sirve también las landings prerenderizadas (es/invertir-en-bali.html, es/zonas/uluwatu.html).
    try_files $uri $uri.html =404;
  }

  # Rutas sin idioma desconocidas → 404 real (incluye /.well-known/*; si algún día hay
  # ficheros en public/.well-known, try_files $uri los sirve). Revisar al añadir un portal.
  location ~ ^/(?!(?:es|en|ro|id|admin|cliente|empleados|agencias|auth|manager|equipo|demo|lofts-globalitae|listing)(?:/|$)) {
    sendfile off;
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/snippets/headers.conf;
    try_files $uri =404;
  }
  error_page 404 /404.html;

  # SPA (portales y /es /en /ro /id): sendfile off para que sub_filter reescriba el
  # <link rel="manifest"> al manifest del portal según la ruta. HTML sin caché.
  location / {
    sendfile off;
    sub_filter '/manifest.webmanifest' '$portal_manifest';
    sub_filter_once on;
    add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/snippets/headers.conf;
    # $uri.html sirve el pre-render OG (dist/<locale>/proyecto/<slug>.html). NO usamos
    # $uri/ (provocaba 301 a barra final y 403 en los directorios de idioma sin index);
    # cualquier ruta no-fichero cae a la SPA /index.html.
    try_files $uri $uri.html /index.html;
  }

  # gzip básico
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
