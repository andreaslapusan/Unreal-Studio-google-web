<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unreal Studio · Sin conexión</title>
<style>
  :root{--cream:#f3e5d8;--brown:#3f2305}
  html,body{margin:0;height:100%;background:var(--cream);color:var(--brown);font-family:Georgia,'Times New Roman',serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box}
  h1{font-size:30px;font-weight:400;margin:0}
  .lema{font-style:italic;font-size:13px;opacity:.75;margin:6px 0 32px}
  p{font-family:-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.5;max-width:320px;margin:0 0 28px}
  button{font:600 16px -apple-system,system-ui,sans-serif;background:var(--brown);color:var(--cream);border:0;border-radius:999px;padding:14px 32px;min-height:48px}
  button:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
</style></head>
<body><main>
  <h1>Unreal Studio</h1>
  <div class="lema">Beyond the Ordinary, Inside the Unreal</div>
  <p id="msg">Sin conexión a internet. Comprueba tu red e inténtalo de nuevo.</p>
  <button id="retry" type="button">Reintentar</button>
</main>
<script src="start.js"></script>
<script>
  var T={es:["Sin conexión a internet. Comprueba tu red e inténtalo de nuevo.","Reintentar"],
    en:["No internet connection. Check your network and try again.","Try again"],
    ro:["Fără conexiune la internet. Verifică rețeaua și încearcă din nou.","Reîncearcă"],
    id:["Tidak ada koneksi internet. Periksa jaringan Anda dan coba lagi.","Coba lagi"]};
  var l=(navigator.language||"es").slice(0,2), t=T[l]||T.en;
  document.documentElement.lang=T[l]?l:"en";
  document.getElementById("msg").textContent=t[0];
  var b=document.getElementById("retry"); b.textContent=t[1];
  function go(){ location.href=window.START_URL||"https://unrealstudiobali.com/"; }
  b.onclick=go; window.addEventListener("online",go);
</script>
</body></html>
